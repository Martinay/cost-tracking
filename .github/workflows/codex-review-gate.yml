name: Reconcile Codex review status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to reconcile
        required: true
        type: string

permissions: {}

# All event types and manual runs share the same lock. Never cancel a writer.
# Queued events may be replaced or delivered out of order; each reads live state.
concurrency:
  group: codex-review-reconcile-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reconcile-codex-summary:
    name: Reconcile Codex summary metadata
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Reconcile using trusted default-branch code only
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
              throw new Error('PR number must be a positive integer');
            }
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const { data: source } = await github.rest.repos.getContent({
              owner, repo, ref: repository.default_branch,
              path: 'scripts/codex-review-gate.cjs'
            });
            if (source.type !== 'file' || source.encoding !== 'base64') {
              throw new Error('Missing trusted reconciler');
            }
            // Only this repository's default branch supplies executable code.
            // PR refs, artifacts, event bodies and comment text never do.
            const module = { exports: {} };
            new Function('module', Buffer.from(source.content, 'base64').toString('utf8'))(module);
            await module.exports.reconcile({
              github, owner, repo, pullNumber: Number(process.env.PR_NUMBER),
              runUrl: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            });
